<!DOCTYPE html>
<html lang="en">
<head>
    <title>ROV Character Market - Dynamic Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00f2ff;
            --secondary-glow: #d044ff;
            --bg-dark: #121218;
            --bg-light: #1A1A22;
            --text-main: #EAEAEA;
            --text-secondary: #B0B0B0;
            --font-title: 'Cinzel', serif;
            --font-body: 'Roboto', sans-serif;
        }

        body { 
            font-family: var(--font-body); 
            margin: 0;
            background-image: url('image/Map Rov 4_0.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(18, 18, 24, 0.85);
            z-index: -1;
        }

        .container { 
            max-width: 1200px; 
            margin: auto;
            padding: 2em;
        }

        h1, h2 {
            font-family: var(--font-title);
            text-align: center;
            letter-spacing: 3px;
        }
        
        h1 {
            font-size: 3em;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow), 0 0 40px var(--secondary-glow);
            margin-bottom: 0.5em;
        }

        h2 {
            font-size: 2em;
            margin-top: 2em;
            border-bottom: 1px solid var(--primary-glow);
            padding-bottom: 10px;
            display: inline-block;
        }
        
        .center-h2 {
             width: 100%;
             text-align: center;
        }
        
        .center-h2 h2{
             display: inline-block;
             border-bottom: 1px solid var(--primary-glow);
             padding-bottom: 10px;
        }

        #status { font-weight: bold; text-align:center; display:block; margin-bottom: 2em; color: var(--text-secondary); height: 1em;}

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0, 195, 255, 0.3);
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--secondary-glow);
            border-color: rgba(0, 195, 255, 0.7);
        }

        .card .img-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }
        
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .card:hover img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 20px;
        }
        
        .card h3 { 
            margin-top: 0;
            margin-bottom: 10px;
            font-family: var(--font-title);
            font-size: 1.5em;
            letter-spacing: 2px;
        }
        
        .card .price {
            font-size: 1.2em;
            color: var(--primary-glow);
            margin-bottom: 20px;
        }

        .buy-btn {
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: var(--font-body);
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(208, 68, 255, 0.7);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            border-bottom: 1px solid rgba(0, 195, 255, 0.2);
            padding: 15px;
            text-align: left;
        }
        
        th { 
            background-color: rgba(0, 195, 255, 0.1);
            font-family: var(--font-title);
            letter-spacing: 1px;
        }
        
        tbody tr:nth-child(even) {
            background-color: rgba(0,0,0,0.2);
        }
        
        tbody tr:hover {
            background-color: rgba(0, 195, 255, 0.15);
        }
        
        td:nth-child(3) {
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ROV Character Market</h1>
        <p id="status">Connecting to MetaMask...</p>

        <div id="market" class="card-container">
            <!-- Character cards will be dynamically injected here by JavaScript -->
        </div>

        <div class="center-h2">
             <h2>Purchase History</h2>
        </div>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Character (ID)</th>
                    <th>Owner Address</th>
                </tr>
            </thead>
            <tbody>
                <!-- History rows will be injected here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.min.js";

        // IMPORTANT: Deploy the new RovMarket.sol and paste the new address here
        const contractAddress = '0xF6e19926217791b00130795f1325a6134915cD46';
        const contractABI = [
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "name",
				"type": "string"
			}
		],
		"name": "buyCharacter",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": false,
				"internalType": "address",
				"name": "from",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "characterName",
				"type": "string"
			},
			{
				"indexed": false,
				"internalType": "uint256",
				"name": "timestamp",
				"type": "uint256"
			}
		],
		"name": "BuyCharacter",
		"type": "event"
	},
	{
		"inputs": [],
		"name": "CHARACTER_PRICE",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getPurchaseHistory",
		"outputs": [
			{
				"components": [
					{
						"internalType": "address",
						"name": "owner",
						"type": "address"
					},
					{
						"internalType": "string",
						"name": "characterName",
						"type": "string"
					},
					{
						"internalType": "uint256",
						"name": "timestamp",
						"type": "uint256"
					}
				],
				"internalType": "struct RovMarket.Purchase[]",
				"name": "",
				"type": "tuple[]"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "purchaseHistory",
		"outputs": [
			{
				"internalType": "address",
				"name": "owner",
				"type": "address"
			},
			{
				"internalType": "string",
				"name": "characterName",
				"type": "string"
			},
			{
				"internalType": "uint256",
				"name": "timestamp",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]
        
        // This list is dynamically generated from the files found in your 'image/' folder
        const fileList = [
            "Valhein.jpeg", "Errol.jpeg", "Veera.jpeg", "Butterfly.jpeg", "Ormarr.jpeg",
            "Yorn.jpeg", "Hayate.jpeg", "Xeniel.jpeg", "Murad.jpeg", "Maloch.jpeg", "Kriknak.jpeg",
            "Wukong.jpeg", "Raz.jpeg", "Zuka.jpeg", "Tulen.jpeg", "Lindis.jpeg", "Superman.jpeg",
            "Joker.jpeg", "Ryoma.jpeg", "Zill.jpeg", "The Flash.jpeg", "Tachi.jpeg", "Kahlii.jpeg",
            "Airi.jpeg", "Zata.jpeg", "Aleister (Remake).jpeg", "Tel'Annas.jpeg", "Riktor.jpeg"
        ];

        const characters = fileList.map(filename => {
            // Attempt to clean up the name for display
            let cleanName = filename.replace(/\.(jpeg|webp|png|gif)$/i, ''); // Remove common extensions
            cleanName = cleanName.replace(/\(.*\)/, ''); // Remove anything in parentheses
            cleanName = cleanName.replace(/_/g, ' '); // Replace underscores with spaces
            cleanName = cleanName.trim();

            return {
                name: cleanName,
                price: "0.001", // Fixed price from contract
                img: `image/${filename}`,
                id: filename // The full filename is the unique ID passed to the contract
            };
        });

        let provider, signer, contract;
        let contractFixedPrice = "0.001"; // Default price for display

        async function init() {
            if (typeof window.ethereum === 'undefined') {
                updateStatus("MetaMask is not installed!");
                return;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                
                if (contractAddress !== '0x8708f2B5d0ad690734cFc88d0b95edD9E33452D1') {
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    contractFixedPrice = ethers.formatEther(await contract.CHARACTER_PRICE()); // Get actual fixed price from contract
                    listenForEvents();
                    loadInitialHistory();
                } else {
                     updateStatus("⚠️ PLEASE DEPLOY NEW CONTRACT AND UPDATE ADDRESS");
                }
                
                const userAddress = await signer.getAddress();
                console.log(`Connected: ${userAddress}`);
                
                renderMarket();

            } catch (error) {
                console.error("Initialization failed:", error);
                updateStatus("Connection failed. Please connect to MetaMask.");
            }
        }

        async function loadInitialHistory() {
            try {
                if (!contract) {
                    console.error("Contract not initialized for history loading.");
                    updateStatus("Contract not connected. Please deploy and update address.");
                    return;
                }
                const history = await contract.getPurchaseHistory();
                console.log("Fetched history:", history);
                const tableBody = document.querySelector("#historyTable tbody");
                tableBody.innerHTML = '';
                history.forEach(purchase => {
                    // In the dynamic market, characterName from contract is the filename (ID)
                    addHistoryRow(purchase.owner, purchase.characterName, purchase.timestamp);
                });
            } catch (error) {
                console.error("Could not fetch history:", error);
                updateStatus("Could not fetch purchase history. Check contract deployment and address.");
            }
        }
        
        function renderMarket() {
            const marketContainer = document.getElementById('market');
            marketContainer.innerHTML = '';
            
            let statusMsg = "Ready";
            if(contractAddress === 'YOUR_CONTRACT_ADDRESS_HERE') {
                statusMsg = "⚠️ PLEASE DEPLOY NEW CONTRACT AND UPDATE ADDRESS";
            }
            updateStatus(statusMsg);

            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${char.img}" alt="${char.name}">
                    </div>
                    <div class="card-content">
                        <h3>${char.name}</h3>
                        <p class="price">${contractFixedPrice} ETH</p>
                        <button class="buy-btn" data-id="${char.id}" data-price="${contractFixedPrice}">Buy</button>
                    </div>
                `;
                marketContainer.appendChild(card);
            });
        }

        async function handleBuyClick(event) {
            if (!event.target.classList.contains('buy-btn')) return;
            
            if (contractAddress === 'YOUR_CONTRACT_ADDRESS_HERE') {
                alert("Please deploy the new contract and update the 'contractAddress' in the index.html file first!");
                return;
            }
            if (!contract) {
                alert("Contract not initialized. Please connect MetaMask and ensure contract address is correct.");
                return;
            }

            const id = event.target.dataset.id; // Use the unique filename ID
            const price = event.target.dataset.price; // This will be the fixed price
            
            updateStatus(`Acquiring ${id}...`);

            try {
                const tx = await contract.buyCharacter(id, { // Pass the ID (filename) to the contract
                    value: ethers.parseEther(price)
                });
                
                updateStatus(`Transaction sent! Waiting for confirmation...`);
                await tx.wait(); 
                updateStatus(`✅ ${id} acquired successfully!`);

            } catch (error) {
                console.error("Purchase failed:", error);
                const reason = error.reason || "Transaction was rejected or failed.";
                updateStatus(`❌ Error buying ${id}: ${reason}`);
            }
        }

        function listenForEvents() {
            if (!contract) return;
            contract.on("BuyCharacter", (from, characterName, timestamp) => {
                console.log("Event received:", { from, characterName, timestamp });
                const tableBody = document.querySelector("#historyTable tbody");
                const firstRow = tableBody.firstChild;
                // Add new purchase to the top of the table. No need to clear and re-load all history.
                addHistoryRow(from, characterName, timestamp);
               
                const statusEl = document.getElementById('status');
                const originalStatus = statusEl.innerText;
                statusEl.innerText = `⚡ Someone just bought ${characterName}!`;
                setTimeout(() => { statusEl.innerText = originalStatus; }, 5000);
            });
        }
        
        function addHistoryRow(owner, name, timestamp) {
            const tableBody = document.querySelector("#historyTable tbody");
            const newRow = tableBody.insertRow(0); // Insert at the top

            newRow.insertCell(0).textContent = new Date(Number(timestamp) * 1000).toLocaleString();
            newRow.insertCell(1).textContent = name; // The name from the contract is the filename
            newRow.insertCell(2).textContent = owner;
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        document.getElementById('market').addEventListener('click', handleBuyClick);
        
        init();
    </script>
</body>
</html>
