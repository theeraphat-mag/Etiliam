<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Name in Blockchain Class</title>
    <link rel="stylesheet" type="text/css" href="main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Student Name in Blockchain Class V2</h1>
        <label class="col-lg-2 control-label">
        Name Registration</label>
        <input id="document1" type="text">
        <button id="btnRegistration">Registration</button>
                
        <label class="col-lg-2 control-label">
        Check Student Name</label>
        <input id="document2" type="text">
        <button id="btnCheck">Check</button> 
               
        <label class="col-lg-2 control-label">Status</label>
        <h2 id="result"></h2>
        Status: <span id="status">Loading...</span>
    </div>

    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.min.js";

        let signer = null;
        let provider, contract;
        let currentAccount = null;
        const contractAddress = '0x8A518b7e941572dbb89459FAb2bD9a77537FD729';

        let abi = [
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": false,
				"internalType": "address",
				"name": "from",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "text",
				"type": "string"
			},
			{
				"indexed": false,
				"internalType": "bytes32",
				"name": "hash",
				"type": "bytes32"
			}
		],
		"name": "NameAdded",
		"type": "event"
	},
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "name",
				"type": "string"
			}
		],
		"name": "registration",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": false,
				"internalType": "address",
				"name": "from",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "text",
				"type": "string"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "reason",
				"type": "string"
			}
		],
		"name": "RegistrationError",
		"type": "event"
	},
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "name",
				"type": "string"
			}
		],
		"name": "checkName",
		"outputs": [
			{
				"internalType": "bool",
				"name": "",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]

        // ===Connecting to MetaMask===
        async function loadWeb3() {
            if (window.ethereum) {
                try{
                    // MetaMask is installed (Browser-injected Provider)
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);

                    // To request user's account from Metamask
                    await handleAccountsChanged(accounts);

                } catch (error) {
                    // If this happens, the user rejected the connection request.
                    if (err.code === 4001) {
                        console.log('Please connect to MetaMask.');
                    } else {
                        console.error(err);
                    }
                }
            } else {
                console.log('MetaMask is not installed!');
            }
        }
         
        // If the array of accounts is non-empty, you're already connected.
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', handleAccountsChanged);
        }

        // For now, 'eth_accounts' will continue to always return an array
        async function handleAccountsChanged(accounts) {
            if (accounts.length === 0) {
                // MetaMask is locked or the user has not connected any accounts
                console.log('Please connect to MetaMask.');

            } else if (accounts[0] !== currentAccount) {
                currentAccount = accounts[0];  //account แรกที่เลือกใน metamask
                // Get the Signer

                signer = await provider.getSigner(); //provider ที
                console.log("Signer address:", await signer.getAddress()); //ถ้าใช้เงิน ให้ใช้ signer เพื่อเซ็นต์ทรานแซคชัน


            }
        }

        async function load() {
            await loadWeb3();
            contract = await loadContract();
            updateStatus('Ready!');
        }

        async function loadContract() {
            //Contract Object with Signer
            return new ethers.Contract(contractAddress, abi, signer);

        }
        
        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = status;
            console.log(status);
        }

        $("#btnRegistration").click(async function() {
            console.log("Current Account:", currentAccount);
            try {
                const docValue = $("#document1").val();
                const amount = ethers.parseEther("0.002"); // ส่งค่า 0.002 ETH
                // Registration transaction call
                const result = await contract.registration(docValue, {value: amount});
                // await result.wait();

                console.log("Tx Hash:", result.hash);
                $("#result").html("Transaction Sent: " + result.hash);

                contract.once("NameAdded", (from ,text, hash, event) => {
                    console.log("NameAdded event received:", event);
                    $("#result").html( `Name Registered: ${text} <br/>=> Hash: ${hash}`);
                });

                contract.once("RegistrationError", (from ,text, reason, event) => {
                    console.log("RegistrationError event received:", event);
                    $("#result").html( `Registration Error: ${text} Reason: ${reason}`);
                });

            } catch (error) {
                console.error("Registration Error:", error);
                $("#result").html("Error: " + error.message);
            }
        });

        $("#btnCheck").click(async function() {
            try {
                const docValue = $("#document2").val();
                // Check Name transaction call
                const result = await contract.checkName(docValue);

                $("#result").html(result.toString());
                
            } catch (error) {
                console.error("Check Error:", error);
                $("#result").html("Error checking name");
            }
        });

        load();
    </script>
</body>
</html>
